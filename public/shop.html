<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoriaH - Loja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="shop-screen" class="screen active">
        <div class="app-container">
            <header class="main-header">
                <div class="player-profile">
                    <div class="avatar-container"><div class="avatar">🧑‍🔬</div><div class="player-level">14</div></div>
                    <div class="name-level"><div class="name">Hugo Vieira</div><div class="xp-bar"><div class="xp-progress"></div></div></div>
                </div>
                <div class="player-currencies"><div>✏️ <span>3290</span></div><div>🧠 <span>127</span></div></div>
            </header>
            <div class="shop-body">
                <div class="shop-header"><h2>Ofertas Diárias</h2><p>Novas cartas aparecem em 1h 42min</p></div>
                <h4>Personagens</h4>
                <div class="items-grid">
                    <div class="item-card"><p class="rarity raro">Raro</p><img src="https://placehold.co/150x120/4299E1/FFFFFF?text=Tesla" alt="Nikola Tesla"><p class="name">Nikola Tesla</p><div class="price laps">✏️ 1000</div></div>
                    <div class="item-card"><p class="rarity epico">Épico</p><img src="https://placehold.co/150x120/9F7AEA/FFFFFF?text=Ada" alt="Ada Lovelace"><p class="name">Ada Lovelace</p><div class="price laps">✏️ 2500</div></div>
                </div>
            </div>
            <footer class="shop-footer"><a href="student-home.html" class="btn-back">Voltar ao Menu</a></footer>
        </div>
    </div>
</body>
</html>
