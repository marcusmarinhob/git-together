<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoriaH - Painel Professor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="professor-home-screen" class="screen active">
        <div class="app-container">
            <header class="main-header">
                <div class="player-profile">
                    <div class="avatar-container"><div class="avatar">🧑‍🏫</div></div>
                    <div class="name-level"><div class="name">Prof. Carlos</div></div>
                </div>
                <a href="index.html" class="action-button">Sair</a>
            </header>
            <div class="menu-body" style="grid-template-columns: 1fr;">
                <div class="panel-card">
                    <h4>Minhas Turmas</h4>
                    <div class="subjects-list">
                        <div class="subject-item">
                            <span class="subject-name">Biologia - 3º Ano</span>
                            <button class="btn-practice">Iniciar Battle Class</button>
                        </div>
                        <div class="subject-item">
                            <span class="subject-name">Ciências - 9º Ano</span>
                            <button class="btn-practice">Iniciar Battle Class</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
