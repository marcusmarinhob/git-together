<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoriaH - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h2 class="text-3xl font-bold text-white mb-2">Olá!</h2>
            <p class="text-gray-400 mb-8">Faça login para continuar.</p>
            <div class="space-y-4">
                <input type="email" placeholder="E-mail" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="password" placeholder="Senha" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button id="login-button" class="w-full mt-8 py-3 rounded-xl text-white font-semibold transition-colors bg-indigo-600 hover:bg-indigo-700">Entrar</button>
            <a href="#" class="block text-center mt-4 text-indigo-400 hover:underline">Esqueci minha senha</a>
        </div>
    </div>
</body>
</html>
